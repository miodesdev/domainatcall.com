/* ---------- Zustand (localStorage) ---------- */
const DEF={theme:"white",lvl:"simple",mode:"keywords",acc:"fast",reg:"namecheap",fav:[],tlds:["com","de","net","org","es","ru","tech","io","app","ai","dev","cc"],
 cust:Array(8).fill(""),custOn:Array(8).fill(false),prefix:"dk",hyph:true,pos:0,kw:"",sLen:[1,2,3],sSet:0,eKw:"",eLen:[1,2],eSet:0,ePos:[0,1]};
let S;try{S={...DEF,...JSON.parse(localStorage.getItem("dc")||"{}")}}catch(e){S={...DEF}}
const save=()=>{try{localStorage.setItem("dc",JSON.stringify(S))}catch(e){}};
const ALL=DEF.tlds,PRESETS={pop:["com","de","net"],tech:["io","ai","dev","app","tech"],all:ALL};
const REGS={namecheap:["Namecheap",d=>`https://www.namecheap.com/domains/registration/results/?domain=${d}`],porkbun:["Porkbun",d=>`https://porkbun.com/checkout/search?q=${d}`],godaddy:["GoDaddy",d=>`https://www.godaddy.com/domainsearch/find?domainToCheck=${d}`]};
const $=s=>document.querySelector(s),L=()=>LANGS.indexOf(S.lang);
const syncLang=()=>{const l=document.documentElement.getAttribute("data-lang");S.lang=LANGS.includes(l)?l:"en"};syncLang();
const t=(k,...a)=>{const v=T[k][L()];return typeof v==="function"?v(...a):v};
const fmt=n=>n.toLocaleString(S.lang);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Logik (1:1 aus der App) ---------- */
const OKCH=/^[a-z0-9-]+$/;
function cleanLabel(raw){let s=raw.trim().toLowerCase();const i=s.indexOf(".");if(i>=0)s=s.slice(0,i);
 s=s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9-]/g,"").replace(/^-+|-+$/g,"");
 return s&&s.length<=63?s:null}
function cleanTLD(s){let x=s.trim().toLowerCase().replace(/^\.+/,"");return x.length>=2&&x.length<=63&&OKCH.test(x)&&!x.startsWith("-")&&!x.endsWith("-")?x:null}
const activeTLDs=()=>{const o=ALL.filter(x=>S.tlds.includes(x));S.cust.forEach((r,i)=>{const c=cleanTLD(r);if(S.custOn[i]&&c&&!o.includes(c))o.push(c)});return o};
const keywordList=()=>{const seen=new Set(),o=[];for(const r of S.kw.split(/[,;\n\t ]+/)){const k=cleanLabel(r);if(k&&!seen.has(k)){seen.add(k);o.push(k)}}return o};
const CH=c=>[..."abcdefghijklmnopqrstuvwxyz"].slice(0,c==1?0:26).concat(c==1||c==2?[..."0123456789"]:[]);
const ipow=(b,e)=>{let r=1;while(e-->0)r*=b;return r};
const shortCount=(ch,lens)=>lens.reduce((a,l)=>a+ipow(ch.length,l),0);
function shortAt(ch,lens,i){for(const len of [...lens].sort()){const blk=ipow(ch.length,len);if(i<blk){const o=Array(len);for(let p=len-1;p>=0;p--){o[p]=ch[i%ch.length];i=Math.floor(i/ch.length)}return o.join("")}i-=blk}return""}
function buildLabels(){const kws=keywordList(),j=S.hyph?"-":"",seen=new Set(),o=[];const add=s=>{if(!seen.has(s)){seen.add(s);o.push(s)}};
 if(S.pos==2){for(const a of kws)for(const b of kws)if(a!==b)add(a+j+b);return o}
 const p=S.prefix.trim().toLowerCase().replace(/^-+|-+$/g,"");
 for(const k of kws)add(!p?k:S.pos==0?p+j+k:k+j+p);return o}
const eKwClean=()=>S.eKw.trim().toLowerCase();
function eKwErr(){const k=eKwClean();if(!k)return null;if(!OKCH.test(k))return t("e1");if(k.startsWith("-")||k.endsWith("-"))return t("e2");if(k.length+3>63)return t("e3");return null}
function expandCount(){const c=CH(S.eSet).length;let n=0;for(const l of S.eLen){const b=ipow(c,l);if(S.ePos.includes(0))n+=b;if(S.ePos.includes(1))n+=b;if(S.ePos.includes(2)&&l>=2)n+=(l-1)*b}return n}
function buildExpand(){const kw=eKwClean();if(!kw||eKwErr())return[];const ch=CH(S.eSet),seen=new Set(),o=[];const add=s=>{if(!seen.has(s)){seen.add(s);o.push(s)}};
 for(const n of [...S.eLen].sort()){const g=i=>shortAt(ch,[n],i),c=ipow(ch.length,n);
  if(S.ePos.includes(0))for(let i=0;i<c;i++)add(g(i)+kw);
  if(S.ePos.includes(1))for(let i=0;i<c;i++)add(kw+g(i));
  if(S.ePos.includes(2)&&n>=2)for(let k=1;k<n;k++){const lc=ipow(ch.length,k),rc=ipow(ch.length,n-k);for(let i=0;i<lc;i++){const l=shortAt(ch,[k],i);for(let j=0;j<rc;j++)add(l+kw+shortAt(ch,[n-k],j))}}}
 return o}
const simple=()=>S.lvl=="simple";
function queryCount(){const e=activeTLDs().length;if(simple())return keywordList().length*e;
 if(S.mode=="keywords"){const n=keywordList().length;return(S.pos==2?n*(n-1):n)*e}
 if(S.mode=="short")return shortCount(CH(S.sSet),S.sLen)*e;return expandCount()*e}
function canStart(){if(!activeTLDs().length)return false;if(simple())return keywordList().length>0;
 if(S.mode=="short"&&!S.sLen.length)return false;
 if(S.mode=="expand"&&(!eKwClean()||eKwErr()||!S.eLen.length||!S.ePos.length))return false;return true}

/* ---------- DNS / RDAP (Cloudflare DoH, IANA-Bootstrap) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ctl={stop:false};
const validate=l=>!l?"empty":l.length>63||/^-|-$/.test(l)||!OKCH.test(l)?"invalid":null;
async function doh(domain){const r=await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=NS`,{headers:{accept:"application/dns-json"},signal:AbortSignal.timeout(8000)});return(await r.json()).Status}
async function checkFast(domain){for(let a=0;a<3;a++){if(ctl.stop)return"unclear";try{const s=await doh(domain);if(s===3)return"free";if(s===0)return"taken"}catch(e){}if(a<2)await sleep(400*(a+1))}return"unclear"}
let rdapMap=null;
async function rdapBase(tld){if(!rdapMap){try{const j=await(await fetch("https://data.iana.org/rdap/dns.json")).json(),m={};for(const[tl,urls]of j.services){const b=urls.find(u=>u.startsWith("https://"))||urls[0];for(const x of tl)m[x.toLowerCase()]=b}rdapMap=m}catch(e){return null}}return rdapMap[tld]}
async function rdap(domain,tld){const b=await rdapBase(tld);if(!b)return"unclear";const url=(b.endsWith("/")?b:b+"/")+"domain/"+domain;
 for(let a=0;a<4;a++){if(ctl.stop)return"unclear";try{const r=await fetch(url,{headers:{accept:"application/rdap+json"},signal:AbortSignal.timeout(10000)});if(r.status===404)return"free";if(r.status===200)return"taken"}catch(e){}if(a<3)await sleep(800*(a+1))}return"unclear"}
async function check(label,tld){if(validate(label))return"unclear";const d=label+"."+tld,r=await checkFast(d);return r==="free"&&S.acc==="thorough"?rdap(d,tld):r}

/* ---------- Lauf ---------- */
let run={rows:new Map(),runTLDs:[],total:0,done:0,free:0,unclear:0,t0:0,running:false};
const rate=()=>parseFloat(localStorage.getItem("rate_"+S.acc))||(S.acc=="fast"?40:10);
function startPressed(){if(run.running||!canStart())return;if(queryCount()>20000){$("#bigMsg").textContent=t("big",fmt(queryCount()));$("#dBig").showModal()}else start()}
async function start(){
 let src,count;
 if(simple()||S.mode=="keywords"){const l=simple()?keywordList():buildLabels();src=i=>l[i];count=l.length}
 else if(S.mode=="short"){const ch=CH(S.sSet);count=shortCount(ch,S.sLen);src=i=>shortAt(ch,S.sLen,i)}
 else{const l=buildExpand();src=i=>l[i];count=l.length}
 const tlds=activeTLDs();if(!tlds.length||!count)return;
 const acc=S.acc;ctl={stop:false};
 run={rows:new Map(),runTLDs:tlds,total:count*tlds.length,done:0,free:0,unclear:0,t0:performance.now(),running:true};
 ui();draw();
 let next=0,last=0,tmr=0;const conc=acc=="fast"?24:12;
 const worker=async()=>{while(!ctl.stop&&next<run.total){const k=next++,label=src(Math.floor(k/tlds.length)),tld=tlds[k%tlds.length],st=await check(label,tld);
  if(ctl.stop)return;run.done++;
  if(st==="free"){run.free++;(run.rows.get(label)||run.rows.set(label,new Set()).get(label)).add(tld)}else if(st==="unclear")run.unclear++;
  const n=performance.now();if(run.done>=run.total){last=n}else if(n-last>300){last=n;draw()}else if(!tmr){tmr=setTimeout(()=>{tmr=0;if(run.running){last=performance.now();draw()}},300-(n-last))}}};
 await Promise.all(Array.from({length:conc},worker));clearTimeout(tmr);tmr=0;
 const el=(performance.now()-run.t0)/1000;
 if(!ctl.stop&&run.done>=50&&el>2)try{localStorage.setItem("rate_"+acc,run.done/el)}catch(e){}
 run.running=false;ui();draw()}
function stop(){ctl.stop=true;run.running=false;ui();draw()}
const freeDomains=()=>{const o=[];for(const[l,s]of run.rows)for(const x of run.runTLDs)if(s.has(x))o.push(l+"."+x);return o.sort()};

/* ---------- Aktionen ---------- */
const copy=async s=>{try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}};
const whois=d=>window.open(d.endsWith(".de")?`https://www.denic.de/service/whois-service/?domain=${d}`:`https://www.whois.com/whois/${d}`,"_blank","noopener");
const buy=d=>window.open(REGS[S.reg][1](encodeURIComponent(d)),"_blank","noopener");
const isFav=d=>S.fav.includes(d);
function toggleFav(d){S.fav=isFav(d)?S.fav.filter(x=>x!==d):[...S.fav,d];save();ui();draw()}
function openMenu(btn,d){const m=$("#rmenu"),rn=REGS[S.reg][0],f=isFav(d);
 m.innerHTML=`<div class="d">${esc(d)}</div>`;
 [[t("whois"),()=>whois(d)],[t("buy",rn),()=>buy(d)],[f?t("remFav"):t("addFav"),()=>toggleFav(d)],[t("copyD"),()=>copy(d)]].forEach(([txt,fn])=>{const b=document.createElement("button");b.textContent=txt;b.onclick=()=>{m.style.display="none";fn()};m.appendChild(b)});
 m.style.display="block";const r=btn.getBoundingClientRect();m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+"px";m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+"px"}
document.addEventListener("click",e=>{if(!e.target.closest("#rmenu")&&!e.target.closest("button.free"))$("#rmenu").style.display="none"});

/* ---------- Oberfläche ---------- */
function seg(el,opts,cur,on){el.innerHTML="";opts.forEach(([v,txt])=>{const b=document.createElement("button");b.textContent=txt;if(v===cur)b.className="on";b.disabled=run.running&&el.dataset.lock!=="0";b.onclick=()=>on(v);el.appendChild(b)})}
function checks(el,vals,cur,on,lab){el.innerHTML="";vals.forEach(v=>{const l=document.createElement("label");l.className="cb";const i=document.createElement("input");i.type="checkbox";i.checked=cur.includes(v);i.disabled=run.running;i.onchange=()=>on(v,i.checked);l.append(i,document.createTextNode(lab?lab(v):v));el.appendChild(l)})}
const set=(k,v)=>{S[k]=v;save();ui()};
const toggleIn=(k,v,on)=>{S[k]=on?[...new Set([...S[k],v])]:S[k].filter(x=>x!==v);save();ui()};
function ui(){
 $("#tool").dataset.theme=S.theme;
 const ts=$("#themeSeg");ts.innerHTML="";for(const k of["white","teal","blue","yellow","pink","green"]){const b=document.createElement("button");b.className="chip"+(S.theme===k?" on":"");b.textContent=t("th_"+k);b.dataset.th=k;b.onclick=()=>set("theme",k);ts.appendChild(b)}
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 const busy=run.running;
 seg($("#lvl"),[["simple",t("simple")],["advanced",t("adv")]],S.lvl,v=>set("lvl",v));
 $("#favBtn").textContent="⭐ "+t("fav")+(S.fav.length?` (${S.fav.length})`:"");
 $("#simpleBox").classList.toggle("hide",!simple());$("#advBox").classList.toggle("hide",simple());
 for(const id of["kwS","kwA"]){const e=$("#"+id);if(e!==document.activeElement)e.value=S.kw;e.disabled=busy}
 const kl=keywordList();$("#hint").textContent=kl.length?t("will")+kl.slice(0,8).join(", ")+(kl.length>8?" …":""):t("hintEmpty");
 /* Endungen */
 const pr=$("#presets");pr.innerHTML="";for(const[k,v]of Object.entries(PRESETS)){const b=document.createElement("button");b.className="chip"+(S.tlds.length==v.length&&v.every(x=>S.tlds.includes(x))?" on":"");b.textContent=k=="tech"?"Tech":t(k);b.title=v.map(x=>"."+x).join(" ");b.disabled=busy;b.onclick=()=>set("tlds",[...v]);pr.appendChild(b)}
 const a=activeTLDs(),sm=$("#tldSum");sm.textContent=a.length?a.map(x=>"."+x).join("  "):t("noext");sm.className="note"+(a.length?"":" err");
 const open=!$("#tldDetail").classList.contains("hide");$("#tldMore").textContent=open?t("less"):t("pick");$("#tldMore").disabled=busy;sm.classList.toggle("hide",open);
 checks($("#tldGrid"),ALL,S.tlds,(v,on)=>{S.tlds=on?[...S.tlds,v]:S.tlds.filter(x=>x!==v);save();ui()},v=>"."+v);
 const cg=$("#custGrid");cg.innerHTML="";S.cust.forEach((txt,i)=>{const w=document.createElement("span");w.className="cust";const c=document.createElement("input");c.type="checkbox";c.checked=S.custOn[i];c.disabled=busy||!cleanTLD(txt);c.onchange=()=>{S.custOn[i]=c.checked;save();ui()};
  const x=document.createElement("input");x.type="text";x.placeholder=".xyz";x.value=txt;x.disabled=busy;x.className=txt.trim().length>=2&&!cleanTLD(txt)?"bad":"";
  x.oninput=()=>{const was=!!cleanTLD(S.cust[i]),is=!!cleanTLD(x.value);S.cust[i]=x.value;if(!is)S.custOn[i]=false;else if(!was)S.custOn[i]=true;save();ui();const n=$("#custGrid").children[i].querySelector("input[type=text]");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  x.onchange=()=>ui();w.append(c,x);cg.appendChild(w)});
 /* Erweitert */
 seg($("#tabs"),["keywords","short","expand"].map(m=>[m,t("m_"+m)]),S.mode,v=>set("mode",v));$("#tabs").className="tabs";$("#tabs").style.opacity=busy?.5:1;{const tb=$("#tabs"),o=tb.querySelector(".on");if(o&&(o.offsetLeft<tb.scrollLeft||o.offsetLeft+o.offsetWidth>tb.scrollLeft+tb.clientWidth))tb.scrollLeft=Math.max(0,o.offsetLeft-12)}
 for(const m of["keywords","short","expand"])$("#m_"+m).classList.toggle("hide",S.mode!==m);
 $("#prefix").value!==S.prefix&&($("#prefix").value=S.prefix);$("#prefix").disabled=busy||S.pos==2;$("#hyph").checked=S.hyph;$("#hyph").disabled=busy;
 seg($("#pos"),[0,1,2].map(i=>[i,t("p"+i)]),S.pos,v=>set("pos",v));
 checks($("#sLen"),[1,2,3,4],S.sLen,(v,on)=>toggleIn("sLen",v,on));
 seg($("#sSet"),[0,1,2].map(i=>[i,t("c"+i)]),S.sSet,v=>set("sSet",v));
 $("#eKw").value!==S.eKw&&($("#eKw").value=S.eKw);$("#eKw").disabled=busy;
 checks($("#eLen"),[1,2,3],S.eLen,(v,on)=>toggleIn("eLen",v,on));
 seg($("#eSet"),[0,1,2].map(i=>[i,t("c"+i)]),S.eSet,v=>set("eSet",v));
 checks($("#ePos"),[0,1,2],S.ePos,(v,on)=>toggleIn("ePos",v,on),v=>t("ep"+v));
 /* Zähler */
 const q=queryCount(),e=a.length,c=$("#count");let txt="";
 if(S.mode=="keywords"){const n=kl.length;txt=(S.pos==2?t("comb")+" ":"")+t("cnt",fmt(n),fmt(S.pos==2?n*(n-1):n),e,fmt(q))}
 else if(S.mode=="short")txt=t("cnt2",fmt(shortCount(CH(S.sSet),S.sLen)),e,fmt(q));
 else txt=t("cnt2",fmt(expandCount()),e,fmt(q))+" "+t("cnt3")+(eKwErr()?" ⚠ "+eKwErr():"");
 c.textContent=txt;c.className="note "+(q>500000?"err":q>20000?"warn":"");
 /* Steuerung */
 $("#go").textContent=t("check");$("#go").disabled=!canStart();$("#go").classList.toggle("hide",busy);
 $("#stop").classList.toggle("hide",!busy);$("#stop").textContent=t("stop");
 const qc=queryCount(),est=qc/rate();$("#est").textContent=!busy&&qc?(est<2?t("under2"):"≈ "+dur(est))+" · "+t(S.acc=="fast"?"a1":"a0"):"";
 $("#copyFree").disabled=!run.rows.size;
 $("#foot").textContent=t("foot")+t(S.acc=="fast"?"n1":"n0");$("#priv").textContent=t("priv");
 /* Einstellungen */
 seg($("#accSeg"),[["thorough",t("a0")],["fast",t("a1")]],S.acc,v=>set("acc",v));$("#accExp").textContent=t(S.acc=="fast"?"x1":"x0");
 seg($("#regSeg"),Object.entries(REGS).map(([k,v])=>[k,v[0]]),S.reg,v=>set("reg",v));$("#regSeg").dataset.lock="0";
 favList();
}
function dur(s){s=Math.floor(s);const u=S.lang=="ru"?["с","мин","ч"]:["s","min","h"];return s<60?`${s} ${u[0]}`:s<3600?`${Math.floor(s/60)} ${u[1]}`:`${Math.floor(s/3600)} ${u[2]} ${String(Math.floor(s%3600/60)).padStart(2,"0")} ${u[1]}`}
function favList(){const f=$("#favList");f.innerHTML="";if(!S.fav.length){f.innerHTML=`<p class="note">${esc(t("favEmpty"))}</p>`}
 S.fav.forEach(d=>{const r=document.createElement("div");r.className="favrow";r.innerHTML=`<code>${esc(d)}</code>`;
  [[t("buyS"),()=>buy(d)],["Whois",()=>whois(d)],["🗑",()=>{S.fav=S.fav.filter(x=>x!==d);save();ui();draw()}]].forEach(([x,fn])=>{const b=document.createElement("button");b.textContent=x;b.onclick=fn;r.appendChild(b)});f.appendChild(r)});
 $("#favCopy").disabled=!S.fav.length}
function draw(){
 const bar=$("#bar");bar.classList.toggle("hide",!run.total);bar.max=Math.max(run.total,1);bar.value=run.done;
 let s="";if(run.total){s=t("stats",fmt(run.done),fmt(run.total),fmt(run.free),fmt(run.unclear));const el=(performance.now()-run.t0)/1000;
  if(el>1&&run.done>0&&(run.running||run.done)){const r=run.done/el;s+=` · ${r.toFixed(0)} ${t("qps")}`;if(run.running&&r>0)s+=` · ${t("left")} ${dur((run.total-run.done)/r)}`}}
 $("#stats").textContent=s;$("#copyFree").disabled=!run.rows.size;
 $("#coffee").classList.toggle("hide",run.running||!run.free);
 const tb=$("#tbl");
 if(!run.total){tb.innerHTML=`<div class="empty"><b>🔍</b>${esc(t(simple()?"emptySimple":"emptyAdv"))}${simple()?`<br><br><button id="ex">${esc(t("example"))}</button>`:""}</div>`;const ex=$("#ex");if(ex)ex.onclick=()=>set("kw","sonnenhof, nordwind, blauwerk");return}
 const rows=[...run.rows].slice(0,1000);
 let h=`<table><thead><tr><th>Domain</th>${run.runTLDs.map(x=>`<th>.${esc(x)}</th>`).join("")}</tr></thead><tbody>`;
 for(const[l,fs]of rows)h+=`<tr><td>${esc(l)}</td>${run.runTLDs.map(x=>fs.has(x)?`<td><button class="free" data-d="${esc(l+"."+x)}" title="${esc(l+"."+x)}">${isFav(l+"."+x)?"⭐":"✅"}</button></td>`:`<td><span class="no">·</span></td>`).join("")}</tr>`;
 h+="</tbody></table>";
 if(run.rows.size>1000)h+=`<p class="note" style="padding:8px 12px">${esc(t("shown",fmt(1000),fmt(run.rows.size)))}</p>`;
 if(!run.running&&!run.rows.size)h+=`<div class="empty">${esc(t("noRes"))}</div>`;
 tb.innerHTML=h}
$("#tbl").addEventListener("click",e=>{const b=e.target.closest("button.free");if(b)openMenu(b,b.dataset.d)});

/* ---------- Ereignisse ---------- */
$("#kwS").oninput=e=>{S.kw=e.target.value;save();ui()};
$("#kwA").oninput=e=>{S.kw=e.target.value;save();ui()};
for(const id of["kwS","kwA"])$("#"+id).addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();startPressed()}});
$("#prefix").oninput=e=>{S.prefix=e.target.value;save();ui()};
$("#hyph").onchange=e=>set("hyph",e.target.checked);
$("#eKw").oninput=e=>{S.eKw=e.target.value;save();ui()};
$("#tldMore").onclick=()=>{$("#tldDetail").classList.toggle("hide");ui()};
$("#go").onclick=startPressed;$("#stop").onclick=stop;
$("#copyFree").onclick=()=>copy(freeDomains().join("\n"));
$("#favBtn").onclick=()=>{ui();$("#dFav").showModal()};
$("#favCopy").onclick=()=>copy(S.fav.join("\n"));
$("#setBtn").onclick=()=>$("#dSet").showModal();
$("#bigGo").onclick=()=>{$("#dBig").close();start()};
$("#resetBtn").onclick=()=>{if(confirm(t("resetAsk"))){try{localStorage.clear()}catch(e){}location.reload()}};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{if(e.target===d)d.close()}));
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&!run.running){e.preventDefault();startPressed()}});
new MutationObserver(()=>{syncLang();ui();draw()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-lang"]});
ui();draw();

</script>
</body>
</html>
